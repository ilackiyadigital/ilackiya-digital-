.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}

.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav .tab{flex:none;padding:8px 14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.entry{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:10px}
.entry:last-child{border-bottom:0}.meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.amt-in{color:var(--green);font-weight:800;font-size:15px}.amt-out{color:var(--red);font-weight:800;font-size:15px}
.totals{display:flex;gap:8px;margin-bottom:14px}.tbox{flex:1;border-radius:12px;padding:12px 8px;text-align:center;border:1px solid var(--border)}
.tbox .n{font-size:16px;font-weight:800;margin-top:2px}.tbox.in{background:var(--green-light);border-color:var(--green);color:var(--green)}
.tbox.out{background:var(--red-light);border-color:var(--red);color:var(--red)}.tbox.net{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}

.avatar-ph{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--blue-light);color:var(--blue);font-size:20px;font-weight:800}

const app=document.getElementById("app");

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function todayStr(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function P(path){
  const id=(masterSession&&masterViewBizId)?masterViewBizId:bizId;
  if(!id) throw new Error("Business Code இல்லை");
  return "businesses/"+id+"/"+path;
}

/* =========================
   ATTENDANCE
========================= */
async function recordStaffAttendance(username){
  if(!username) return;
  const date=todayStr();
  const ref=dbc.doc(P("attendance/"+date+"_"+username));
  const now=Date.now();
  try{
    const snap=await withTimeout(ref.get());
    if(snap.exists){
      await withTimeout(ref.set({username,date,lastLoginTs:now,status:"present"},{merge:true}));
    }else{
      await withTimeout(ref.set({username,date,checkInTs:now,lastLoginTs:now,status:"present"}));
    }
  }catch(e){
    console.warn("Attendance save:",e);
    throw new Error("Attendance பதிவு செய்ய முடியவில்லை. Internet / Firestore Rules சரிபார்க்கவும்.");
  }
}
function dateRangeEntries(from,to){
  return cache.entries.filter(e=>{const d=String(e.date||"");return (!from||d>=from)&&(!to||d<=to);});
}
function monthBounds(ym){
  const [y,m]=ym.split("-").map(Number);
  const days=new Date(y,m,0).getDate();
  return {from:ym+"-01",to:ym+"-"+String(days).padStart(2,"0"),days};
}

function compressImage(file,callback){
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement("canvas");
      let w=img.width,h=img.height;
      const max=250;
      if(w>h&&w>max){h=h*max/w;w=max}
      if(h>=w&&h>max){w=w*max/h;h=max}
      canvas.width=Math.max(1,Math.round(w));
      canvas.height=Math.max(1,Math.round(h));
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL("image/jpeg",0.7));
    };
    img.onerror=()=>alert("படத்தை படிக்க முடியவில்லை.");
    img.src=ev.target.result;
  };
  reader.onerror=()=>alert("படத்தை படிக்க முடியவில்லை.");
  reader.readAsDataURL(file);
}

/* =========================
   FIRESTORE HELPERS
========================= */
async function withTimeout(promise,ms=12000){
  let timer;
  const timeout=new Promise((_,reject)=>{
    timer=setTimeout(()=>reject(new Error("Firebase பதில் வர அதிக நேரம் ஆகிறது. Internet / Firestore Rules சரிபார்க்கவும்.")),ms);
  });
  try{return await Promise.race([promise,timeout])}
  finally{clearTimeout(timer)}
}

async function refreshAll(){
  if(!firebaseReady) throw new Error("Firebase connection தொடங்கவில்லை.");
  if(!bizId&&!masterViewBizId) throw new Error("Business Code இல்லை.");

  const result=await withTimeout(Promise.all([
    dbc.doc(P("config/auth")).get(),
    dbc.collection(P("staff")).get(),
    dbc.collection(P("entries")).orderBy("ts","desc").limit(1000).get()
  ]));

  const authSnap=result[0],staffQ=result[1],entQ=result[2];

  if(!authSnap.exists){
    await withTimeout(
      dbc.doc(P("config/auth")).set({ownerUsername:"owner",ownerPassword:"owner123"})
    );
    cache.owner={ownerUsername:"owner",ownerPassword:"owner123"};
  }else{
    cache.owner=authSnap.data()||{ownerUsername:"owner",ownerPassword:"owner123"};
  }

  cache.staff=staffQ.docs.map(d=>({username:d.id,...d.data()})).filter(s=>!s.deleted);
  cache.entries=entQ.docs.map(d=>({id:d.id,...d.data()})).filter(e=>!e.deleted);

  const curId=masterSession&&masterViewBizId?masterViewBizId:bizId;
  const bizDoc=await withTimeout(dbc.doc("businesses/"+curId).get());
  if(!bizDoc.exists) throw new Error("இந்த Business Code-க்கு கடை கிடைக்கவில்லை.");
  if(bizDoc.data().deleted) throw new Error("இந்த கடை தற்போது நீக்கப்பட்ட நிலையில் உள்ளது.");

  APP_NAME=bizDoc.data().name||"Business App";

  /* Saved categories, if available */
  try{
    const cat=await dbc.doc(P("config/categories")).get();
    if(cat.exists&&Array.isArray(cat.data().list)&&cat.data().list.length) BIZ=cat.data().list;
  }catch(e){console.warn("categories:",e)}
  if(!BIZ.some(b=>b.id===activeBiz)) activeBiz=BIZ[0]?.id||"eservice";
  document.title=APP_NAME;
}

/* =========================
   INIT
========================= */
async function handleUrlParams(){
  const params=new URLSearchParams(location.search);
  const bizParam=params.get("biz");
  if(!bizParam||!firebaseReady)return;
  const code=bizParam.trim().toUpperCase();
  try{
    const snap=await withTimeout(dbc.doc("businesses/"+code).get());
    if(snap.exists&&!snap.data().deleted){
      bizId=code;
      localStorage.setItem("illakiya_bizId",code);
    }
  }catch(e){console.warn("URL business:",e)}
}

async function init(){
  if(!firebaseReady)return;
  try{
    const isMaster=new URLSearchParams(location.search).get("master")==="1";
    if(isMaster&&!masterSession){renderMasterLogin();return}

    if(masterSession&&masterViewBizId){
      await refreshAll();
      render();
      return;
    }

    if(bizId){
      try{
        const snap=await withTimeout(dbc.doc(P("config/auth")).get());
        if(!snap.exists){
          await withTimeout(dbc.doc(P("config/auth")).set({
            ownerUsername:"owner",ownerPassword:"owner123"
          }));
        }
      }catch(e){
        showFatal("Firebase / Firestore பிரச்சினை",e.message||String(e));
        return;
      }
      await refreshAll();
    }
    render();
  }catch(e){
    console.error("Init Error:",e);
    showFatal("App ஏற்றுவதில் பிரச்சினை",e.message||String(e));
  }
}

/* =========================
   MAIN ROUTER

function render(){
  if(masterSession&&!masterViewBizId){renderMaster();return}
  if(masterSession&&masterViewBizId){renderOwner();return}
  if(new URLSearchParams(location.search).get("master")==="1"&&!masterSession){renderMasterLogin();return}
  if(!bizId){renderBizGate();return}

  if(!session){
    const devRole=localStorage.getItem("illakiya_devicerole");
    if(!devRole){renderRoleSelect();return}
    renderLogin(devRole);
    return;
  }
  if(session.role==="owner")renderOwner();
  else renderStaff();
}

   BUSINESS GATE
========================= */
function renderBizGate(){

    <div class="hero"><h1>வணக்கம்</h1><div class="sub">வணிக மேலாண்மை தளம்</div></div>

      <div class="small" id="bizStatus" style="margin-top:10px;text-align:center"></div>
    </div>
    <div style="text-align:center;margin-top:14px">
      <button class="linkbtn" id="masterLoginLink">Master Admin Login</button>
    </div>
  `;
  const input=document.getElementById("bizCodeInput");
  input.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("bizGoBtn").click()});
  document.getElementById("bizGoBtn").onclick=async()=>{
    const code=input.value.trim().toUpperCase();
    const status=document.getElementById("bizStatus");
    if(!code){status.textContent="Business Code உள்ளிடவும்";return}
    status.textContent="சரிபார்க்கிறது...";
    try{
      const snap=await withTimeout(dbc.doc("businesses/"+code).get());
      if(!snap.exists||snap.data().deleted){
        status.textContent="தவறான Business Code.";
        return;
      }
      bizId=code;
      localStorage.setItem("illakiya_bizId",code);
      localStorage.removeItem("illakiya_devicerole");
      location.href=location.pathname;
    }catch(e){status.textContent=e.message||"Connection error"}
  };
  document.getElementById("masterLoginLink").onclick=()=>renderMasterLogin();
}

          if(!trimmed){alert("கடை பெயர் காலியாக இருக்கக்கூடாது");return}
          const typesSnap=await withTimeout(dbc.doc("businesses/"+id+"/config/businessTypes").get());
          let types=typesSnap.exists&&Array.isArray(typesSnap.data().list)?typesSnap.data().list:DEFAULT_BIZ.map(x=>x.name);
          const current=data.businessType||types[0]||DEFAULT_BIZ[0].name;
          const type=prompt("Business Type / தொழில் வகை:\n\n"+types.map((x,i)=>(i+1)+". "+x).join("\n")+"\n\nஎண் அல்லது புதிய பெயர் உள்ளிடலாம்:",current);
          if(type===null)return;
          let chosen=type.trim();
          const n=parseInt(chosen,10);
          if(Number.isInteger(n)&&n>=1&&n<=types.length) chosen=types[n-1];
          if(!chosen)chosen=current;
          if(!types.includes(chosen))types.push(chosen);
          await withTimeout(dbc.doc("businesses/"+id).update({name:trimmed,businessType:chosen}));
          await withTimeout(dbc.doc("businesses/"+id+"/config/businessTypes").set({list:types}));
          alert("கடை பெயர் / Business Type மாற்றப்பட்டது.\nBusiness Code மாறவில்லை: "+id);
          renderMaster();
        }catch(e){alert("மாற்ற முடியவில்லை:\n"+e.message)}
      });
      document.querySelectorAll("[data-view]").forEach(b=>b.onclick=async()=>{
        masterViewBizId=b.dataset.view;bizId=masterViewBizId;session={role:"owner"};await refreshAll();render();
      });
      document.querySelectorAll("[data-softdel]").forEach(b=>b.onclick=async()=>{
        if(!confirm("இந்த கடையை குப்பைத்தொட்டிக்கு நகர்த்தவா?"))return;
        await dbc.doc("businesses/"+b.dataset.softdel).update({deleted:true,deletedAt:Date.now()});
        renderMaster();
      });
    }else{
      body.innerHTML=`<div class="card"><div style="font-weight:700;color:var(--red);margin-bottom:10px">நீக்கப்பட்ட கடைகள்</div>
      ${trash.length?trash.map(b=>`
        <div class="entry">
          <div><div style="font-weight:700;text-decoration:line-through;color:var(--sub)">${escapeHtml(b.name||b.id)}</div><div class="meta">Code: <b>${escapeHtml(b.id)}</b></div></div>
          <div style="display:flex;gap:6px"><button class="btn-success btn-sm" data-restore="${escapeHtml(b.id)}">மீட்டெடு</button><button class="btn-danger btn-sm" data-permadel="${escapeHtml(b.id)}">முற்றிலும் நீக்கு</button></div>
        </div>`).join(""):'<div class="small">குப்பைத்தொட்டியில் எதுவும் இல்லை</div>'}</div>`;
      document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=async()=>{
        await dbc.doc("businesses/"+b.dataset.restore).update({deleted:false});renderMaster();
      });
      document.querySelectorAll("[data-permadel]").forEach(b=>b.onclick=async()=>{
        if(!confirm("நிரந்தரமாக அழிக்கவா?"))return;
        alert("முதன்மை business document மட்டும் இங்கே நீக்கப்படுகிறது. அதன் subcollections தனியாக நீக்கப்படாது.");
        await dbc.doc("businesses/"+b.dataset.permadel).delete();renderMaster();
      });
    }
    document.getElementById("masterLogout").onclick=()=>{masterSession=false;masterViewBizId=null;session=null;renderBizGate()};
  }catch(e){showFatal("Master Admin ஏற்ற முடியவில்லை",e.message||String(e))}
}

    }

    if(owner){
      if(u===cache.owner.ownerUsername&&p===cache.owner.ownerPassword){
        session={role:"owner"};
        render();return;
      }
    }else{
      const s=cache.staff.find(x=>x.username===u&&x.password===p);

          render();return;

          err.textContent=attErr.message||"Attendance பதிவு செய்ய முடியவில்லை.";return;
        }
      }
    }

  };

function renderEntries(body){

  body.innerHTML=`
    ${bizTabs()}
    <div class="totals">
      <div class="tbox in"><div>வரவு</div><div class="n">${fmt(inT)}</div></div>
      <div class="tbox out"><div>செலவு</div><div class="n">${fmt(outT)}</div></div>

    ${all.length?all.map(e=>`
      <div class="entry"><div><div style="font-weight:700">${escapeHtml(e.desc||"-")} <span class="meta">(${escapeHtml(e.by||"-")})</span></div><div class="meta">${escapeHtml(e.date||"-")}</div></div>
      <div style="display:flex;align-items:center;gap:8px"><div class="${e.type==="in"?"amt-in":"amt-out"}">${e.type==="in"?"+":"-"}${fmt(e.amt)}</div><button class="btn-danger btn-sm" data-delentry="${escapeHtml(e.id)}">நீக்கு</button></div></div>`).join(""):'<div class="small">பதிவுகள் எதுவும் இல்லை</div>'}</div>`;

    if(!confirm("இந்த பதிவை குப்பைத்தொட்டிக்கு நகர்த்தவா?"))return;
    try{await dbc.doc(P("entries/"+b.dataset.delentry)).update({deleted:true});await refreshAll();render()}catch(e){alert(e.message)}
  });
}

    const data={name:name.trim(),role:role.trim()||"Staff",phone:phone.trim(),salary:parseFloat(sal)||0};
    if(newPass)data.password=newPass;
    try{await dbc.doc(P("staff/"+b.dataset.editstaff)).update(data);await refreshAll();render()}catch(e){alert(e.message)}
  });
}

    try{const from=document.getElementById("summaryFrom").value,to=document.getElementById("summaryTo").value,all=await getFinanceEntries(from,to),inT=all.filter(e=>e.type==="in").reduce((s,e)=>s+Number(e.amt||0),0),outT=all.filter(e=>e.type==="out").reduce((s,e)=>s+Number(e.amt||0),0);box.innerHTML=`<div class="totals"><div class="tbox in"><div>வரவு</div><div class="n">${fmt(inT)}</div></div><div class="tbox out"><div>செலவு</div><div class="n">${fmt(outT)}</div></div><div class="tbox net"><div>இருப்பு</div><div class="n">${fmt(inT-outT)}</div></div></div><div style="font-weight:700;margin:8px 0">${escapeHtml(from)} முதல் ${escapeHtml(to)} வரை · ${all.length} பதிவுகள்</div>`;}catch(e){box.innerHTML='<div class="errorbox">'+escapeHtml(e.message)+'</div>';}
  };
  document.getElementById("runIncomeReport").onclick=runIncome;
  document.getElementById("runExpenseReport").onclick=runExpense;
  document.getElementById("runSummaryReport").onclick=runSummary;
  runIncome(); runExpense(); runSummary();

  const loadAttendance=async()=>{
    const from=document.getElementById("attFrom").value,to=document.getElementById("attTo").value;
    if(from&&to&&from>to){alert("தொடக்க தேதி முடிவு தேதியை விட பெரியதாக இருக்கக்கூடாது.");return;}
    try{
      const q=await withTimeout(dbc.collection(P("attendance")).where("date",">=",from||"0000-01-01").where("date","<=",to||"9999-12-31").get());
      const rows=q.docs.map(d=>d.data()), grouped={}; rows.forEach(r=>{grouped[r.username]=(grouped[r.username]||0)+1;});
      document.getElementById("attendanceReportBox").innerHTML=`${cache.staff.length?cache.staff.map(s=>{const days=grouped[s.username]||0;return `<div class="entry"><div><div style="font-weight:800">${escapeHtml(s.name||s.username)}</div><div class="meta">ID: ${escapeHtml(s.username)} · ${escapeHtml(s.role||"Staff")} · ${escapeHtml(s.phone||"Phone இல்லை")}</div></div><div style="text-align:right"><div style="font-weight:800;color:var(--green)">${days} நாள்</div><div class="meta">Present</div></div></div>`}).join(""):'<div class="small">பணியாளர்கள் இல்லை.</div>'}<div class="small" style="margin-top:8px">மொத்த Attendance பதிவுகள்: ${rows.length}</div>`;

      const grouped={}; q.docs.forEach(d=>{const r=d.data();grouped[r.username]=(grouped[r.username]||0)+1;});
      document.getElementById("salaryReportBox").innerHTML=`${cache.staff.length?cache.staff.map(s=>{const present=grouped[s.username]||0,monthly=Number(s.salary||0),earned=monthly>0?(monthly/b.days)*present:0;return `<div class="entry"><div><div style="font-weight:800">${escapeHtml(s.name||s.username)}</div><div class="meta">Phone: ${escapeHtml(s.phone||"-")} · மாத சம்பளம்: ${fmt(monthly)} · ${present}/${b.days} நாட்கள்</div></div><div style="text-align:right"><div style="font-weight:800;color:var(--blue)">${fmt(earned)}</div><div class="meta">கணக்கிடப்பட்ட சம்பளம்</div></div></div>`}).join(""):'<div class="small">பணியாளர்கள் இல்லை.</div>'}`;
    }catch(e){document.getElementById("salaryReportBox").innerHTML='<div class="errorbox">'+escapeHtml(e.message)+'</div>';}

async function renderSettings(body){
  const defaultTypes=["ஈ-சேவை மையம்","ஜெராக்ஸ் கடை","போட்டோகிராஃபி / ஸ்டூடியோ","மளிகைக் கடை","ரீசார்ஜ் / மொபைல் கடை","கம்ப்யூட்டர் / ஆன்லைன் சேவை","துணிக்கடை","ஹோட்டல் / உணவகம்","ஸ்டேஷனரி கடை"];
  const defaultServices=["பொது சேவை","பொருட்கள் விற்பனை","பிற சேவை"];
  let types=[...defaultTypes], services=[...defaultServices], currentType="";
  body.innerHTML='<div class="loading">அமைப்புகள் ஏற்றுகிறது...</div>';
  try{
    const results=await Promise.all([
      withTimeout(dbc.doc("businesses/"+(masterSession&&masterViewBizId?masterViewBizId:bizId)).get()),
      withTimeout(dbc.doc(P("config/businessTypes")).get()),
      withTimeout(dbc.doc(P("config/particulars")).get())
    ]);
    const businessData=results[0].data()||{};
    if(results[1].exists && Array.isArray(results[1].data().list)) types=results[1].data().list;
    if(results[2].exists && Array.isArray(results[2].data().list)) services=results[2].data().list;
    currentType=businessData.businessType||types[0]||defaultTypes[0];
    if(!types.includes(currentType)) types.unshift(currentType);
  }catch(e){ console.warn("Business settings load:",e); }
  body.innerHTML=`
    <div class="card"><div style="font-weight:700;margin-bottom:8px">கடை பெயர் திருத்து</div><input id="set_bname" value="${escapeHtml(APP_NAME)}"><button class="btn-primary" id="saveBName">பெயரைச் சேமி</button></div>
    <div class="card"><div style="font-weight:800;margin-bottom:8px">🏪 Business Type / தொழில் வகை</div>
      <label>தற்போதைய தொழில் வகை</label><select id="businessTypeSelect">${types.map(t=>`<option value="${escapeHtml(t)}" ${t===currentType?'selected':''}>${escapeHtml(t)}</option>`).join("")}</select>
      <button class="btn-primary" id="saveBusinessType">தொழில் வகையைச் சேமி</button>
      <div class="row" style="margin-top:8px"><button class="btn-outline" id="addBusinessType">➕ புதிய வகை சேர்க்க</button><button class="btn-outline" id="editBusinessType">✏️ தேர்ந்தெடுத்ததை மாற்ற</button></div>
      <button class="btn-danger" id="deleteBusinessType" style="width:100%;margin-top:8px">🗑️ தேர்ந்தெடுத்த வகையை நீக்க</button>
      <div class="small" style="margin-top:8px">தொழில் வகை மாற்றுவதால் பழைய வரவு-செலவு மற்றும் பணியாளர் பதிவுகள் நீக்கப்படாது.</div>
    </div>
    <div class="card"><div style="font-weight:800;margin-bottom:8px">📋 Particulars / Services</div>
      <div id="serviceList">${services.length?services.map((x,i)=>`<div class="entry"><div>${escapeHtml(x)}</div><div style="display:flex;gap:5px"><button class="btn-outline btn-sm" data-editservice="${i}">மாற்று</button><button class="btn-danger btn-sm" data-delservice="${i}">நீக்கு</button></div></div>`).join(""):'<div class="small">சேவைகள் இல்லை</div>'}</div>
      <label>புதிய Particular / Service</label><input id="newService" placeholder="எ.கா. Photo Print / அரிசி / Recharge"><button class="btn-primary" id="addService">➕ Particular சேர்க்க</button>
    </div>
    <div class="card"><div style="font-weight:700;margin-bottom:8px">Owner Login மாற்ற</div><label>Login ID</label><input id="o_uid" value="${escapeHtml(cache.owner.ownerUsername)}"><label>புதிய கடவுச்சொல்</label><input id="o_pwd" type="password" value="${escapeHtml(cache.owner.ownerPassword)}"><button class="btn-primary" id="saveOPass">சேமி</button></div>
    <div class="card"><div style="font-weight:700">Business Code</div><div style="font-size:20px;font-weight:800;margin-top:6px">${escapeHtml((masterSession&&masterViewBizId?masterViewBizId:bizId)||"-")}</div><div class="small" style="margin-top:6px">Business Type மாற்றினாலும் இந்த Code மாறாது.</div></div>`;
  const businessRef="businesses/"+(masterSession&&masterViewBizId?masterViewBizId:bizId);
  const saveTypes=async()=>withTimeout(dbc.doc(P("config/businessTypes")).set({list:types}));
  const saveServices=async()=>withTimeout(dbc.doc(P("config/particulars")).set({list:services}));
  document.getElementById("saveBName").onclick=async()=>{
    const n=document.getElementById("set_bname").value.trim();if(!n)return;
    try{await withTimeout(dbc.doc(businessRef).update({name:n}));APP_NAME=n;document.title=n;alert("கடை பெயர் மாற்றப்பட்டது!");render()}catch(e){alert(e.message)}
  };
  document.getElementById("saveBusinessType").onclick=async()=>{
    const chosen=document.getElementById("businessTypeSelect").value;
    try{await withTimeout(dbc.doc(businessRef).update({businessType:chosen}));alert("Business Type சேமிக்கப்பட்டது!");}catch(e){alert("சேமிக்க முடியவில்லை: "+e.message)}
  };
  document.getElementById("addBusinessType").onclick=async()=>{
    const name=prompt("புதிய Business Type பெயர் உள்ளிடவும்:");if(!name||!name.trim())return;
    const v=name.trim();if(types.includes(v)){alert("இந்த வகை ஏற்கனவே உள்ளது");return}
    types.push(v);try{await saveTypes();alert("புதிய Business Type சேர்க்கப்பட்டது");render()}catch(e){types.pop();alert(e.message)}
  };
  document.getElementById("editBusinessType").onclick=async()=>{
    const old=document.getElementById("businessTypeSelect").value;
    const name=prompt("Business Type-ஐ மாற்றவும்:",old);if(!name||!name.trim()||name.trim()===old)return;
    const v=name.trim();if(types.includes(v)){alert("இந்த பெயர் ஏற்கனவே உள்ளது");return}
    types=types.map(t=>t===old?v:t);
    try{await saveTypes();if(currentType===old)await withTimeout(dbc.doc(businessRef).update({businessType:v}));alert("Business Type மாற்றப்பட்டது");render()}catch(e){alert(e.message)}
  };
  document.getElementById("deleteBusinessType").onclick=async()=>{
    const chosen=document.getElementById("businessTypeSelect").value;
    if(types.length<=1){alert("குறைந்தது ஒரு Business Type இருக்க வேண்டும்");return}
    if(!confirm(`“${chosen}” வகையை பட்டியலிலிருந்து நீக்கவா? பழைய பதிவுகள் அழிக்கப்படாது.`))return;
    types=types.filter(t=>t!==chosen);
    try{await saveTypes();if(currentType===chosen)await withTimeout(dbc.doc(businessRef).update({businessType:types[0]}));alert("Business Type பட்டியலிலிருந்து நீக்கப்பட்டது");render()}catch(e){alert(e.message)}
  };
  document.getElementById("addService").onclick=async()=>{
    const input=document.getElementById("newService"),v=input.value.trim();if(!v){alert("Particular / Service பெயர் உள்ளிடவும்");return}
    if(services.includes(v)){alert("இந்த Service ஏற்கனவே உள்ளது");return}
    services.push(v);try{await saveServices();render()}catch(e){services.pop();alert(e.message)}
  };
  document.querySelectorAll("[data-editservice]").forEach(btn=>btn.onclick=async()=>{
    const i=Number(btn.dataset.editservice),old=services[i];const v=prompt("Particular / Service பெயரை மாற்றவும்:",old);
    if(!v||!v.trim()||v.trim()===old)return;services[i]=v.trim();
    try{await saveServices();render()}catch(e){services[i]=old;alert(e.message)}
  });
  document.querySelectorAll("[data-delservice]").forEach(btn=>btn.onclick=async()=>{
    const i=Number(btn.dataset.delservice),old=services[i];if(!confirm(`“${old}”-ஐ நீக்கவா? ஏற்கனவே உள்ள வரவு-செலவு பதிவுகள் அழிக்கப்படாது.`))return;
    services.splice(i,1);try{await saveServices();render()}catch(e){services.splice(i,0,old);alert(e.message)}
  });
  document.getElementById("saveOPass").onclick=async()=>{
    const u=document.getElementById("o_uid").value.trim(),p=document.getElementById("o_pwd").value;
    if(!u||!p){alert("Login ID மற்றும் password தேவை");return}
    try{await withTimeout(dbc.doc(P("config/auth")).set({ownerUsername:u,ownerPassword:p}));cache.owner={ownerUsername:u,ownerPassword:p};alert("Login மாற்றப்பட்டது!");render()}catch(e){alert(e.message)}
  };
}

    ${list.length?list.map(e=>`<div class="entry"><div><div style="font-weight:700">${escapeHtml(e.desc||"-")}</div><div class="meta">${escapeHtml(e.date||"-")}</div></div><div class="${e.type==="in"?"amt-in":"amt-out"}">${e.type==="in"?"+":"-"}${fmt(e.amt)}</div></div>`).join(""):'<div class="small">பதிவுகள் இல்லை</div>'}</div>`;
  attachBizTabs();
  document.getElementById("viewIdCardBtn").onclick=()=>document.getElementById("idCardModal").classList.toggle("hidden");
  document.getElementById("uploadMyPhotoBtn").onclick=()=>document.getElementById("myPhotoInput").click();
  document.getElementById("myPhotoInput").onchange=e=>{
    if(e.target.files[0])compressImage(e.target.files[0],async b64=>{
      try{await dbc.doc(P("staff/"+session.username)).update({photo:b64});await refreshAll();render()}catch(err){alert(err.message)}
    });
  };
  document.getElementById("downloadIdCardBtn").onclick=()=>{
    alert("ID Card படம் சேமிப்பு வசதிக்கு html2canvas library தேவை. இந்த version-ல் external dependency நீக்கப்பட்டதால் browser print/screenshot பயன்படுத்தலாம்.");
  };
  document.getElementById("logoutBtn").onclick=()=>{session=null;render()};
  document.getElementById("addBtn").onclick=async()=>{
    const amt=parseFloat(document.getElementById("eamt").value),type=document.getElementById("etype").value,desc=document.getElementById("edesc").value.trim();
    if(!amt||amt<=0){alert("தொகை உள்ளிடவும்");return}
    try{await withTimeout(dbc.collection(P("entries")).add({biz:activeBiz,type,amt,desc,date:todayStr(),ts:Date.now(),by:session.username,deleted:false}));await refreshAll();render()}catch(e){alert("பதிவு சேமிக்க முடியவில்லை:\n"+e.message)}
  };
}

  if(!firebaseReady)return;
  await handleUrlParams();
  await init();
})();
